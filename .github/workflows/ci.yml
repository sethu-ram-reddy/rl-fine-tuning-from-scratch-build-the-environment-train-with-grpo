name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the benchmark
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Exercise the installed command
        run: >-
          countdown-grpo --sft-steps 2 --strict-steps 3 --fail-open-steps 2
          --draws 100 --held-tasks 10 --attempts 2 --output runs/ci
