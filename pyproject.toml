[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countdown-grpo"
version = "0.1.0"
description = "A reproducible GRPO and reward-gaming benchmark on arithmetic tasks"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3"]

[project.scripts]
countdown-grpo = "rlvr.cli:main"

[tool.setuptools]
packages = ["rlvr"]
py-modules = ["model", "scaffold"]

[project.optional-dependencies]
charts = ["matplotlib>=3.7,<4"]
